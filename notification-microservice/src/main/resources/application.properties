spring.application.name=notification-microservice
server.port=8084
spring.profiles.active=docker

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Exchange & Queue
app.rabbitmq.exchange=notification.exchange
app.rabbitmq.queue=notification.queue
app.rabbitmq.routingkey=notification.*

# Cola de usuarios
app.rabbitmq.users.exchange=users.fanout.exchange
app.rabbitmq.users.queue=notification-service-users-queue
app.rabbitmq.users.routingkey=
app.rabbitmq.users.exchange-type=fanout